version: 2

project_name: actually-fine

before:
  hooks:
    - go mod tidy

builds:
  - id: actually-fine
    main: ./cmd/actually-fine
    binary: actually-fine
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    files:
      - README.md
      - LICENSE*
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^style:'
      - '^Merge pull request'
      - '^Merge branch'

release:
  github:
    owner: Tnsor-Labs
    name: actually-fine
